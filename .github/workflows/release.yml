name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build and test before releasing
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test -n "$cargo_version"
          test "$tag_version" = "$cargo_version"
          test -s "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release --locked --workspace

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Check WASM targets
        run: |
          cargo check --locked -p numr-core --target wasm32-unknown-unknown --no-default-features --features wasm
          cargo check --locked -p numr-editor --target wasm32-unknown-unknown --no-default-features --features wasm

  # Create GitHub Release first (before uploading binaries)
  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false

  # Build and upload binaries for all platforms
  upload-binaries:
    needs: create-release
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: numr,numr-cli
          target: ${{ matrix.target }}
          archive: numr-$tag-$target
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # Update AUR package (binary) - skip for pre-releases
  aur:
    needs: upload-binaries
    if: ${{ !contains(github.ref, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download binaries and get sha256
        id: sha256
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/numr-v${{ steps.version.outputs.version }}"
          curl -fsSL "$base-x86_64-unknown-linux-gnu.tar.gz" -o x86_64.tar.gz
          curl -fsSL "$base-aarch64-unknown-linux-gnu.tar.gz" -o aarch64.tar.gz
          echo "x86_64=$(sha256sum x86_64.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "aarch64=$(sha256sum aarch64.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" aur/PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${{ steps.sha256.outputs.x86_64 }}')/" aur/PKGBUILD
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${{ steps.sha256.outputs.aarch64 }}')/" aur/PKGBUILD

      - name: Generate .SRCINFO
        uses: docker://archlinux:latest
        with:
          entrypoint: bash
          args: |
            -c "
            pacman -Sy --noconfirm base-devel &&
            useradd -m builder &&
            chown -R builder:builder aur &&
            cd aur &&
            su builder -c 'makepkg --printsrcinfo > .SRCINFO'
            "

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: numr
          pkgbuild: ./aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.version.outputs.version }}"
          assets: |
            ./aur/.SRCINFO

  # Update Homebrew tap - skip for pre-releases
  homebrew:
    needs: upload-binaries
    if: ${{ !contains(github.ref, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download binaries and get sha256
        id: sha256
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/numr-v${{ steps.version.outputs.version }}-aarch64-apple-darwin.tar.gz" -o arm.tar.gz
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/numr-v${{ steps.version.outputs.version }}-x86_64-apple-darwin.tar.gz" -o intel.tar.gz
          echo "sha256_arm=$(sha256sum arm.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "sha256_intel=$(sha256sum intel.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Update formula
        run: |
          sed -i 's/version ".*"/version "${{ steps.version.outputs.version }}"/' homebrew/numr.rb
          # Update ARM sha256 (line after on_arm do)
          sed -i '/on_arm do/{n;n;s/sha256 ".*"/sha256 "${{ steps.sha256.outputs.sha256_arm }}"/}' homebrew/numr.rb
          # Update Intel sha256 (line after on_intel do)
          sed -i '/on_intel do/{n;n;s/sha256 ".*"/sha256 "${{ steps.sha256.outputs.sha256_intel }}"/}' homebrew/numr.rb

      - name: Push to Homebrew tap
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          SSH_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        with:
          source-directory: homebrew
          destination-github-username: nasedkinpv
          destination-repository-name: homebrew-tap
          target-branch: main
          target-directory: Formula
          commit-message: "Update numr to ${{ steps.version.outputs.version }}"
